name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit public source
        run: python scripts/public_source.py --check-index
      - name: Unit and synthetic tests
        run: python -m unittest discover -s tests -v
